plugins:
  rr_geo_enabled:
    default: true
    client: true
  rr_geo_ipinfo_token:
    default: ""
    client: true

  rr_set_profile_location_if_blank:
    default: true
    client: true

  rr_geo_default_tokens:
    default: "toronto,gta,ontario,canada"
    client: true

  # ===== v0.4.0 hybrid feed ranking weights (relative; 0 disables a signal) =====
  rr_geo_weight_location:
    default: 3
    min: 0
    max: 100
  rr_geo_weight_affinity:
    default: 2
    min: 0
    max: 100
  rr_geo_weight_engagement:
    default: 2
    min: 0
    max: 100
  rr_geo_weight_freshness:
    default: 2
    min: 0
    max: 100
  rr_geo_weight_learned:
    default: 2
    min: 0
    max: 100
  rr_geo_weight_explore:
    default: 1
    min: 0
    max: 100

  # ===== v0.7.0 fresh-post lottery: a RECENT topic gets a slight random chance
  # to surface near the TOP of the feed (discovery for brand-new content). =====
  rr_geo_weight_fresh_boost:
    default: 2
    min: 0
    max: 100
  rr_geo_fresh_boost_window_hours:
    default: 48
    min: 1
    max: 336
  rr_geo_fresh_boost_chance:
    default: 12
    min: 0
    max: 100

  # ===== v0.8.0 LIVE- adaptation server complements =====
  # Re-seed the explore + fresh-lottery jitter every N minutes (instead of once
  # per day) so the feed visibly rotates on each visit. Stays constant within a
  # single scroll session (pages load within seconds), so pagination is stable.
  rr_geo_seed_bucket_minutes:
    default: 25
    min: 5
    max: 1440
  # Engagement VELOCITY: boost topics getting activity RIGHT NOW (recent posts),
  # so "hot right now" bubbles up instead of old cumulative-heavy threads.
  rr_geo_weight_velocity:
    default: 3
    min: 0
    max: 100
  rr_geo_velocity_window_hours:
    default: 8
    min: 1
    max: 168
