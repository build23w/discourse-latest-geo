plugins:
  rr_geo_enabled:
    default: true
    client: true
  # ===== v0.15.0 geolocation source =====
  # auto: the platform's edge geolocation when it answers (/rr-geo/detect.json,
  # backed by Cloudflare's visitor-location data), falling back to ipinfo.io.
  # cloudflare: edge only, never call ipinfo. ipinfo: the pre-0.15 behavior.
  rr_geo_source:
    default: auto
    type: enum
    choices:
      - auto
      - cloudflare
      - ipinfo
    client: true
  rr_geo_ipinfo_token:
    default: ""
    client: true

  rr_set_profile_location_if_blank:
    default: true
    client: true

  rr_geo_default_tokens:
    default: "toronto,gta,ontario,canada"
    client: true

  # ===== v0.4.0 hybrid feed ranking weights (relative; 0 disables a signal) =====
  rr_geo_weight_location:
    default: 3
    min: 0
    max: 100
  rr_geo_weight_affinity:
    default: 2
    min: 0
    max: 100
  rr_geo_weight_engagement:
    default: 2
    min: 0
    max: 100
  rr_geo_weight_freshness:
    default: 2
    min: 0
    max: 100
  rr_geo_weight_learned:
    default: 2
    min: 0
    max: 100
  rr_geo_weight_explore:
    default: 1
    min: 0
    max: 100
  # ===== v0.13.0 hub: social signal — topics by followed authors (coin-engine graph) =====
  rr_geo_weight_social:
    default: 2
    min: 0
    max: 100

  # ===== v0.7.0 fresh-post lottery: a RECENT topic gets a slight random chance
  # to surface near the TOP of the feed (discovery for brand-new content). =====
  rr_geo_weight_fresh_boost:
    default: 2
    min: 0
    max: 100
  rr_geo_fresh_boost_window_hours:
    default: 48
    min: 1
    max: 336
  rr_geo_fresh_boost_chance:
    default: 12
    min: 0
    max: 100

  # ===== v0.8.0 LIVE- adaptation server complements =====
  rr_geo_seed_bucket_minutes:
    default: 25
    min: 5
    max: 1440
  rr_geo_weight_velocity:
    default: 3
    min: 0
    max: 100
  rr_geo_velocity_window_hours:
    default: 8
    min: 1
    max: 168

  # ===== v0.10.0 performance refactor =====
  # Full scoring only runs for topics bumped within this window; the long
  # tail short-circuits to 0 and falls back to bumped order.
  rr_geo_rank_horizon_days:
    default: 60
    min: 1
    max: 3650
  # Serve feed pages from a per-(user, seed-bucket) cached id window. The
  # feed is stable within a bucket BY DESIGN, so bucket expiry invalidates.
  rr_geo_cache_enabled:
    default: true
  rr_geo_cache_topics:
    default: 150
    min: 30
    max: 500
  # Cap on prefetched geo/learned boost ids inlined as a VALUES join.
  rr_geo_match_limit:
    default: 400
    min: 50
    max: 2000
  # Client model re-ranks the topic-list DATA before render (bounded lift).
  rr_geo_client_rerank:
    default: true
    client: true
  # Logged-out visitors learn + re-rank locally; nothing is synced.
  rr_geo_anon_personalization:
    default: true
    client: true
  # Daily job tags recent topics with detected city names (title or first
  # post) so geo matching rides the indexed tag path. Visible content change
  # -- intentionally OFF until explicitly enabled.
  rr_geo_auto_tag_cities:
    default: false

  # ===== v0.12 graded-geo tunables (were code defaults; now exposed) =====
  # Geo matching window — local content is evergreen, so much wider than the
  # rank horizon.
  rr_geo_match_horizon_days:
    default: 1095
    min: 60
    max: 3650
  # Guaranteed local representation: top-N geo-matched topics woven into the
  # first feed page when they don't surface on score alone. 0 disables.
  rr_geo_local_floor:
    default: 4
    min: 0
    max: 12

  # ===== v0.14.0 geo mesh: radius geofence for nearby localities =====
  rr_geo_nearby_radius_km:
    default: 50
    min: 5
    max: 300
  rr_geo_nearby_limit:
    default: 14
    min: 1
    max: 50

  # ===== v0.13.0 opt-in device-GPS location button (ipinfo stays default) =====
  rr_geo_gps_button_enabled:
    default: true
    client: true
