# Syntax gate for this Discourse plugin. The forum (home.renovation.reviews) clones
# this repo fresh on every container boot, so a file that does not parse would take
# the whole forum down on its next restart. This is the minimum bar: everything must
# at least parse. Merges go live automatically at the forum's nightly recycle, or
# immediately via the recycle-forum workflow in gary23w/hrr-infra.
name: plugin ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ruby files must parse
        run: |
          set -e
          while IFS= read -r -d '' f; do ruby -c -- "$f" >/dev/null; done < <(git ls-files -z '*.rb')
          echo "all ruby files parse"
      - name: YAML files must load
        run: |
          set -e
          while IFS= read -r -d '' f; do
            ruby -ryaml -e \
              'YAML.safe_load_file(ARGV.fetch(0), permitted_classes: [], permitted_symbols: [], aliases: false)' \
              -- "$f" >/dev/null
          done < <(git ls-files -z 'config/*.yml' 'config/**/*.yml')
          echo "all yaml files load"
      - name: JS files must parse (if any)
        run: |
          set -e
          count=0
          while IFS= read -r -d '' f; do
            case "$f" in *vendor*) continue ;; esac
            node --check -- "$f"
            count=$((count + 1))
            [ "$count" -ge 50 ] && break
          done < <(git ls-files -z '*.js')
          echo "js ok"
